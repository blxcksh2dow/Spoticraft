plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}
repositories {
    maven { url = 'https://repo1.maven.org/maven2/' }
    mavenCentral()
}
loom {
    splitEnvironmentSourceSets()
    mods {
        spoticraft {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation("net.fabricmc:fabric-loader:${project.loader_version}") {
        version { strictly(project.loader_version) }
    }
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
sourceSets.test.compileClasspath += sourceSets.client.output
sourceSets.test.runtimeClasspath += sourceSets.client.output
// Native bridge is built on Windows once, not on the player's computer at launch.
def bridgeResources = layout.buildDirectory.dir('generated/bridge-resources')
def nativeBridge = tasks.register('compileNativeBridge', Exec) {
    inputs.dir 'native'
    inputs.file 'scripts/build-native.ps1'
    outputs.dir bridgeResources
    doFirst {
        if (!System.getProperty('os.name').startsWith('Windows')) {
            throw new GradleException('Build the Windows helper on Windows (or use the verified CI JAR).')
        }
    }
    commandLine 'powershell.exe', '-NoLogo', '-NoProfile', '-NonInteractive',
        '-File', file('scripts/build-native.ps1').absolutePath, '-RunTests'
}
sourceSets.main.resources.srcDir bridgeResources
processResources.dependsOn nativeBridge
processResources {
    inputs.property 'version', project.version
    inputs.property 'loader_version', project.loader_version
    filesMatching('fabric.mod.json') {
        expand(version: project.version, loader_version: project.loader_version)
    }
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}
test { useJUnitPlatform() }
tasks.register('downloadMod', Copy) {
    dependsOn tasks.named('build')
    from tasks.named('jar')
    into layout.projectDirectory.dir('download')
}
// Remove a previous download artifact too, so a failed clean build cannot look successful.
tasks.named('clean') {
    doLast { delete layout.projectDirectory.file("download/spoticraft-${project.version}.jar") }
}

tasks.named('sourcesJar') {
    dependsOn nativeBridge
    from('native') { into 'native-source' }
}
