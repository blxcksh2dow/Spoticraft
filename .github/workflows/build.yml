name: Build Spoticraft 26.2
on:
  push:
    branches: [arena/01a0dd20-spoticraft]
    paths-ignore:
      - 'download/**'
      - '*.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile and test
        shell: pwsh
        run: ./gradlew.bat --no-daemon --stacktrace clean downloadMod
      - name: Upload installable mod
        uses: actions/upload-artifact@v4
        with:
          name: spoticraft-26.2
          path: download/spoticraft-26.2.jar
          if-no-files-found: error
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            build/reports/
            build/test-results/
          if-no-files-found: ignore
