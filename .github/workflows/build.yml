name: Build Spoticraft 26.2
on:
  push:
    branches: [arena/01a0dd20-spoticraft]
    paths-ignore:
      - 'download/**'
      - '*.md'
      - 'scripts/scan-windows.ps1'
      - '.github/workflows/security-scan.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Preflight native compiler and regression tests
        shell: powershell
        run: ./scripts/build-native.ps1 -RunTests
      - name: Compile and test
        shell: pwsh
        run: |
          & ./gradlew.bat --no-daemon --stacktrace clean downloadMod 2>&1 | Tee-Object -FilePath build-output.log
          $result = $LASTEXITCODE
          if ($result -ne 0) {
            $message = (Get-Content build-output.log | Select-Object -First 100) -join "`n"
            $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Gradle build output::$message"
            exit $result
          }
      - name: Verify packaged artifact
        shell: pwsh
        run: python scripts/verify-artifact.py
      - name: Scan precompiled helper before execution
        shell: powershell
        run: ./scripts/scan-windows.ps1 -Artifact build/generated/bridge-resources/native/Spoticraft.Bridge.exe -ReportPath build/helper-defender.json
      - name: Smoke-test actual precompiled helper
        shell: powershell
        run: ./scripts/test-windows-bridge.ps1
      - name: Require Defender scan of final JAR
        shell: powershell
        run: ./scripts/scan-windows.ps1 -ReportPath build/jar-defender.json
      - name: Record verification results
        shell: pwsh
        run: python scripts/record-verification.py
      - name: Save compiled JAR on session branch
        if: github.ref == 'refs/heads/arena/01a0dd20-spoticraft' && hashFiles('download/SECURITY-HOLD.txt') == ''
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f download/spoticraft-26.2.jar download/spoticraft-26.2-verification.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Add verified Spoticraft 26.2 build"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push origin HEAD:arena/01a0dd20-spoticraft
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          exit 0
      - name: Upload installable mod
        if: hashFiles('download/SECURITY-HOLD.txt') == ''
        uses: actions/upload-artifact@v4
        with:
          name: spoticraft-26.2
          path: |
            download/spoticraft-26.2.jar
            download/spoticraft-26.2-verification.json
          if-no-files-found: error
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            build-output.log
            defender-scan.log
            build/*defender.json
            build/reports/
            build/test-results/
          if-no-files-found: ignore
