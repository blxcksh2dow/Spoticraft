name: Build Spoticraft 26.2
on:
  push:
    branches: [arena/01a0dd20-spoticraft]
    paths-ignore:
      - 'download/**'
      - '*.md'
      - 'scripts/scan-windows.ps1'
      - '.github/workflows/security-scan.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Test Windows media bridge on PowerShell 5.1
        shell: powershell
        run: ./scripts/test-windows-bridge.ps1
      - name: Compile and test
        shell: pwsh
        run: |
          & ./gradlew.bat --no-daemon --stacktrace clean downloadMod 2>&1 | Tee-Object -FilePath build-output.log
          $result = $LASTEXITCODE
          if ($result -ne 0) {
            $message = (Get-Content build-output.log | Select-Object -First 100) -join "`n"
            $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Gradle build output::$message"
            exit $result
          }
      - name: Require Defender scan before publishing
        shell: powershell
        run: ./scripts/scan-windows.ps1
      - name: Save compiled JAR on session branch
        if: github.ref == 'refs/heads/arena/01a0dd20-spoticraft'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f download/spoticraft-26.2.jar
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Add verified Spoticraft 26.2 build"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push origin HEAD:arena/01a0dd20-spoticraft
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          exit 0
      - name: Upload installable mod
        uses: actions/upload-artifact@v4
        with:
          name: spoticraft-26.2
          path: download/spoticraft-26.2.jar
          if-no-files-found: error
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            build-output.log
            build/reports/
            build/test-results/
          if-no-files-found: ignore
